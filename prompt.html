<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Cc rules</title>
<style>
  :root {
    --ink: #1b1b1f;
    --muted: #67666e;
    --accent: #2b5f55;
    --hairline: #e4e2df;
  }
  body {
    margin: 0;
    padding: 22px 24px;
    font-family: system-ui, "Segoe UI", sans-serif;
    font-size: 14px;
    line-height: 1.5;
    color: var(--ink);
    background: #fff;
  }
  h1 { margin: 0 0 8px; font-size: 16px; font-weight: 600; }
  p { margin: 0 0 6px; }
  .who { font-weight: 600; word-break: break-all; }
  .note { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
  ul { margin: 8px 0 14px; padding-left: 20px; }
  li { margin-bottom: 3px; word-break: break-all; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  button {
    font: inherit; font-size: 13.5px;
    padding: 8px 14px;
    border-radius: 4px;
    cursor: pointer;
    border: 1px solid var(--hairline);
    background: #fff;
    color: var(--ink);
  }
  button.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    font-weight: 600;
  }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
  <h1>Someone is missing from Cc</h1>
  <p>This message is going to a person on your watch list, but <span id="count">one person is</span> not copied:</p>
  <ul id="missing"></ul>
  <p class="note">Choose Add to Cc to include them, or go back to keep editing.</p>
  <div class="row">
    <button class="primary" id="add">Add to Cc and send</button>
    <button id="send">Send without</button>
    <button id="cancel">Back to message</button>
  </div>
<script src="prompt.js"></script>
</body>
</html>
